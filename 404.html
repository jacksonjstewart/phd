<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0806" />
<title>The Stewart Lab — Off the map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0806; --text:#e8e2d0; --gold:#c9a14a;
    --text-dim:rgba(232,226,208,0.55); --text-faint:rgba(232,226,208,0.28);
    --serif:'Cormorant Garamond',Georgia,serif;
    --mono:'DM Mono',monospace;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body {
    margin:0; padding:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:var(--serif); font-weight:300;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .bg {
    position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 50% 8%, rgba(201,161,74,0.22), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse 50% 40% at 88% 75%, rgba(201,130,60,0.16), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, #0e0a06 0%, #07050a 55%, #060403 100%);
  }
  .vignette {
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(ellipse 110% 85% at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.48) 80%, rgba(0,0,0,0.80) 100%);
  }
  .wrap { max-width: 560px; padding: 0 32px; }
  .eyebrow {
    font-family:var(--mono); font-size:9px;
    letter-spacing:0.45em; text-transform:uppercase;
    color:var(--gold); margin-bottom:18px;
  }
  h1 {
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:clamp(28px, 4vw, 44px);
    margin:0 0 14px 0; line-height:1.15;
  }
  p {
    font-family:var(--serif); font-style:italic;
    color:var(--text-dim);
    font-size:18px; margin:0 0 32px 0;
  }
  a.back {
    font-family:var(--mono); font-size:9px;
    letter-spacing:0.4em; text-transform:uppercase;
    color:var(--gold); text-decoration:none;
    border-bottom:1px solid rgba(201,161,74,0.45);
    padding-bottom:3px;
  }
  a.back:hover { color:#d9b25a; border-color:#d9b25a; }
  .stamp {
    margin-top:60px;
    font-family:var(--mono); font-size:8px;
    letter-spacing:0.45em; color:var(--text-faint);
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vignette"></div>
<div class="wrap">
  <div class="eyebrow">404 · Off the map</div>
  <h1>This shelf is empty.</h1>
  <p>Whatever you were looking for is not here. Perhaps the librarian moved it.</p>
  <a class="back" href="./">Return to the lab</a>
  <div class="stamp">The Stewart Lab · MMXXVI</div>
</div>
</body>
</html>
